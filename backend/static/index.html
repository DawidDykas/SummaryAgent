<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SummaryAgent — podsumowanie dokumentów AI</title>
<meta name="description" content="Wgraj pliki (PDF, DOCX, TXT, MD, HTML, RTF) i otrzymaj ich podsumowanie od modelu LLM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
      keyframes: {
        floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } },
        shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
        popin: { '0%': { opacity: 0, transform: 'translateY(12px) scale(.985)' }, '100%': { opacity: 1, transform: 'translateY(0) scale(1)' } },
        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
        drift: { '0%,100%': { transform: 'translate(0,0) scale(1)' }, '33%': { transform: 'translate(40px,-30px) scale(1.08)' }, '66%': { transform: 'translate(-30px,25px) scale(.94)' } },
        dash: { 'to': { strokeDashoffset: '-24' } },
      },
      animation: {
        floaty: 'floaty 3.4s ease-in-out infinite',
        shimmer: 'shimmer 2.2s linear infinite',
        popin: 'popin .4s cubic-bezier(.21,1.02,.73,1) both',
        'spin-slow': 'spinSlow 5s linear infinite',
        drift: 'drift 18s ease-in-out infinite',
        dash: 'dash 1.2s linear infinite',
      },
    },
  },
};
</script>
<style>
  [x-cloak] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { background-color: #05070f; }

  .orb { position: absolute; border-radius: 9999px; filter: blur(90px); opacity: .5; }
  .grid-bg {
    background-image: linear-gradient(rgba(148,163,184,.07) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(148,163,184,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 85%);
  }

  .card { background: rgba(11, 16, 32, .62); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); }
  .card-hover { transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card-hover:hover { border-color: rgba(168,85,247,.35); }

  .grad-text { background: linear-gradient(94deg, #a5b4fc 0%, #e879f9 48%, #67e8f9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-btn { background: linear-gradient(93deg, #6366f1 0%, #a855f7 52%, #d946ef 100%); }
  .grad-btn:hover:not(:disabled) { filter: brightness(1.13); box-shadow: 0 14px 40px -14px rgba(168,85,247,.85); transform: translateY(-1px); }
  .grad-btn:active:not(:disabled) { transform: translateY(0); }
  .grad-btn:disabled { filter: grayscale(.7) brightness(.65); cursor: not-allowed; box-shadow: none; }

  .drop-zone { border: 1.5px dashed rgba(148,163,184,.35); transition: all .25s; }
  .drop-zone:hover, .drag-active .drop-zone { border-color: #e879f9; background: rgba(168,85,247,.06); }
  .drag-active { outline: 2px solid rgba(232,121,249,.5); outline-offset: 4px; }

  /* panel Thinking */
  .orb-ring { position: absolute; inset: -14px; border-radius: 9999px; background: conic-gradient(from 0deg, #6366f1, #d946ef, #22d3ee, #6366f1); filter: blur(2px); animation: spinSlow 4.5s linear infinite; opacity: .85; }
  .orb-ring::after { content: ''; position: absolute; inset: 3px; border-radius: 9999px; background: #0b1020; }
  .pulse-ring { position: absolute; inset: -6px; border-radius: 9999px; border: 2px solid rgba(232,121,249,.5); animation: ripple 2.4s cubic-bezier(.2,.6,.3,1) infinite; }
  .pulse-ring.r2 { animation-delay: 1.2s; }
  @keyframes ripple { 0% { transform: scale(.75); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }

  /* Markdown wyniku */
  .prose-summary { color: #cbd5e1; line-height: 1.75; font-size: .95rem; }
  .prose-summary h2 { font-size: 1.02rem; font-weight: 700; color: #f8fafc; margin: 1.4rem 0 .55rem; padding: .45rem .7rem; border-radius: .6rem; background: linear-gradient(93deg, rgba(99,102,241,.16), rgba(217,70,239,.12)); border-left: 3px solid #a855f7; }
  .prose-summary h2:first-child { margin-top: 0; }
  .prose-summary p { margin: .65rem 0; }
  .prose-summary ul, .prose-summary ol { margin: .6rem 0; padding-left: 1.3rem; }
  .prose-summary ul { list-style: disc; } .prose-summary ol { list-style: decimal; }
  .prose-summary li { margin: .35rem 0; }
  .prose-summary li::marker { color: #e879f9; }
  .prose-summary strong { color: #f1f5f9; font-weight: 600; }
  .prose-summary code { background: rgba(148,163,184,.15); padding: .1rem .35rem; border-radius: .3rem; font-size: .85em; }
  .prose-summary pre { background: rgba(2,6,23,.8); border: 1px solid rgba(148,163,184,.2); padding: .8rem; border-radius: .7rem; overflow-x: auto; margin: .8rem 0; }
  .prose-summary pre code { background: none; padding: 0; }
  .prose-summary blockquote { border-left: 3px solid #a855f7; padding-left: .9rem; color: #94a3b8; margin: .8rem 0; }
  .prose-summary table { width: 100%; border-collapse: collapse; margin: .8rem 0; font-size: .88rem; }
  .prose-summary th { background: rgba(99,102,241,.14); }
  .prose-summary th, .prose-summary td { border: 1px solid rgba(148,163,184,.2); padding: .45rem .6rem; text-align: left; }
  .prose-summary a { color: #67e8f9; }
  .prose-summary hr { border-color: rgba(148,163,184,.2); margin: 1rem 0; }

  .scroll-slim::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-slim::-webkit-scrollbar-thumb { background: rgba(148,163,184,.28); border-radius: 8px; }
  .scroll-slim::-webkit-scrollbar-track { background: transparent; }

  .kbd { font: 600 11px/1 Inter, sans-serif; padding: 3px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.18); border-bottom-width: 2px; background: rgba(255,255,255,.07); color: #cbd5e1; }
</style>
</head>

<body class="min-h-screen font-sans text-slate-200 antialiased selection:bg-fuchsia-500/30"
      x-data="summaryApp()" x-init="init()" x-effect="syncDocLang(lang)"
      @keydown.window.ctrl.enter.prevent="generate()"
      @keydown.window.meta.enter.prevent="generate()"
      @dragover.prevent="dragging = true"
      @dragleave.prevent="onDragLeave($event)"
      @drop.prevent="onDrop($event)">

  <!-- ==== TŁO ==== -->
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="orb w-[520px] h-[520px] -left-40 -top-40 bg-indigo-600/45 animate-drift"></div>
    <div class="orb w-[460px] h-[460px] -right-32 top-24 bg-fuchsia-600/35 animate-drift" style="animation-delay:-6s"></div>
    <div class="orb w-[600px] h-[600px] left-1/3 -bottom-64 bg-cyan-600/25 animate-drift" style="animation-delay:-12s"></div>
    <div class="absolute inset-0 grid-bg"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-[#05070f]"></div>
  </div>

  <!-- ==== HEADER ==== -->
  <header class="sticky top-0 z-40 border-b border-white/5 bg-[#05070f]/75 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-3">
      <div class="flex items-center gap-2.5">
        <span class="grid h-9 w-9 place-items-center rounded-xl grad-btn shadow-lg shadow-fuchsia-600/25">
          <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
        </span>
        <div class="leading-tight">
          <div class="text-[15px] font-extrabold tracking-tight text-white">Summary<span class="grad-text">Agent</span></div>
          <div class="hidden text-[11px] text-slate-500 sm:block" x-text="t('tagline')"></div>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- wybór języka (podsumowania) z flagą -->
        <div class="relative" @click.outside="langOpen = false" @keydown.escape.window="langOpen = false">
          <button type="button" id="lang-switcher" @click="langOpen = !langOpen" :disabled="busy"
                  :title="t('lang.title', {name: langName})"
                  class="flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-2.5 py-2 text-xs font-semibold text-slate-200 transition hover:border-white/20 hover:bg-white/10 disabled:opacity-50">
            <span class="text-base leading-none" x-text="langFlag"></span>
            <span class="hidden sm:inline" x-text="langName"></span>
            <svg class="h-3 w-3 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
          </button>
          <div x-show="langOpen" x-cloak x-transition.opacity.duration.150ms
               class="absolute right-0 top-full z-50 mt-2 w-40 overflow-hidden rounded-xl border border-white/10 bg-[#0b1020] py-1 shadow-xl shadow-black/50">
            <template x-for="l in langs" :key="l.code">
              <button type="button" @click="lang = l.code; langOpen = false"
                      class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-xs font-semibold transition hover:bg-white/5"
                      :class="lang === l.code ? 'text-white' : 'text-slate-400'">
                <span class="text-base leading-none" x-text="l.flag"></span>
                <span x-text="l.name"></span>
                <svg x-show="lang === l.code" class="ml-auto h-3.5 w-3.5 text-fuchsia-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
              </button>
            </template>
          </div>
        </div>

        <span x-show="health" x-cloak
              class="hidden items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-300 sm:inline-flex"
              :title="health?.base_url">
          <span class="h-2 w-2 rounded-full animate-pulse" :class="health?.provider === 'ollama' ? 'bg-emerald-400' : 'bg-sky-400'"></span>
          <span x-text="health?.label || '...'"></span>
        </span>
        <a href="#dropzone" class="rounded-lg grad-btn px-3.5 py-2 text-xs font-semibold text-white transition" x-text="t('nav.upload')"></a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-5 pb-20">

    <!-- ==== HERO ==== -->
    <section class="pb-7 pt-10 text-center sm:pt-14">
      <div class="mx-auto mb-4 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-[11px] font-semibold uppercase tracking-[.14em] text-slate-400">
        <span class="h-1.5 w-1.5 rounded-full bg-fuchsia-400"></span>
        PDF · DOCX · TXT · MD · HTML · RTF
      </div>
      <h1 class="mx-auto max-w-3xl text-3xl font-black leading-[1.08] tracking-tight text-white sm:text-[3.1rem] sm:leading-[1.05]"
          x-html="t('hero.title')"></h1>
    </section>

    <!-- ==== OSTRZEŻENIE ==== -->
    <div x-show="ollamaWarning" x-cloak x-transition.opacity
         class="mb-5 flex items-start gap-3 rounded-2xl border border-amber-400/30 bg-amber-400/10 px-4 py-3 text-sm text-amber-200">
      <svg class="mt-0.5 h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span x-text="ollamaWarning"></span>
    </div>

    <div class="grid gap-6 lg:grid-cols-12">

      <!-- ================= LEWA KOLUMNA ================= -->
      <section class="lg:col-span-5 space-y-5">

        <!-- DROPZONE + PLIKI -->
        <div class="card card-hover animate-popin rounded-3xl p-5" :class="dragging ? 'drag-active' : ''" id="dropzone">
          <div class="drop-zone rounded-2xl px-5 py-7 text-center cursor-pointer" @click="$refs.fileInput.click()">
            <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500/25 to-fuchsia-500/25 ring-1 ring-white/10">
              <svg class="h-6 w-6 text-indigo-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
            </div>
            <p class="text-sm font-semibold text-white" x-text="t('drop.title')"></p>
            <p class="mt-1 text-xs text-slate-400">
              <span x-text="t('drop.or')"></span>
              <span class="grad-text font-bold underline decoration-fuchsia-400/60 underline-offset-4" x-text="t('drop.choose')"></span>
              · <span x-text="t('drop.max', {mb: maxFileMb, n: maxFiles})"></span>
            </p>
            <input type="file" x-ref="fileInput" multiple class="hidden" @click.stop
                   accept=".pdf,.docx,.txt,.md,.markdown,.html,.htm,.rtf"
                   @change="onPick($event)">
          </div>

          <!-- lista plików -->
          <div x-show="docs.length || errors.length" class="mt-4 space-y-2">
            <div class="flex items-center justify-between px-1">
              <span class="text-[11px] font-bold uppercase tracking-widest text-slate-500"><span x-text="t('files.label')"></span> (<span x-text="docs.length"></span>)</span>
              <button x-show="docs.length" @click="reset()" class="text-[11px] font-semibold text-slate-500 transition hover:text-fuchsia-300" x-text="t('files.clearAll')"></button>
            </div>

            <template x-for="doc in docs" :key="doc.id">
              <div class="group rounded-xl border border-white/10 bg-slate-900/50 px-3 py-2.5 transition hover:border-fuchsia-400/30 animate-popin">
                <div class="flex items-center gap-3">
                  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-[10px] font-black tracking-wide"
                        :class="badgeClass(doc.format)" x-text="shortFmt(doc.format)"></span>
                  <div class="min-w-0 flex-1">
                    <div class="truncate text-[13px] font-semibold text-white" x-text="doc.name" :title="doc.name"></div>
                    <div class="text-[11px] text-slate-500">
                      <span x-text="fmtNum(doc.chars, lang)"></span> <span x-text="t('doc.chars')"></span> ·
                      <span x-text="fmtNum(doc.words, lang)"></span> <span x-text="t('doc.words')"></span> ·
                      <span class="text-indigo-300" x-text="(doc.chunks === 1 ? '1' : doc.chunks) + ' ' + partsWord(doc.chunks, lang)"></span>
                      <span x-show="doc.chunks > 1" class="ml-1 rounded bg-amber-400/15 px-1.5 py-0.5 text-[10px] font-bold text-amber-300" x-text="t('doc.split')"></span>
                    </div>
                  </div>
                  <button @click="expanded = expanded === doc.id ? null : doc.id" :title="t('a11y.preview')"
                          class="grid h-7 w-7 place-items-center rounded-md text-slate-500 transition hover:bg-white/10 hover:text-slate-300">
                    <svg class="h-4 w-4 transition-transform" :class="expanded === doc.id && 'rotate-180'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
                  </button>
                  <button @click="removeDoc(doc.id)" :title="t('a11y.remove')"
                          class="grid h-7 w-7 place-items-center rounded-md text-slate-500 transition hover:bg-red-500/15 hover:text-red-400">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                  </button>
                </div>
                <div x-show="expanded === doc.id" x-cloak x-transition.opacity
                     class="mt-2 max-h-28 overflow-y-auto scroll-slim rounded-lg bg-black/30 p-2.5 text-[11px] leading-relaxed text-slate-400"
                     x-text="doc.preview + '…'"></div>
              </div>
            </template>

            <template x-for="(err, i) in errors" :key="'e'+i">
              <div class="flex items-start gap-2 rounded-xl border border-red-500/25 bg-red-500/10 px-3 py-2 text-xs text-red-300 animate-popin">
                <svg class="mt-0.5 h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                <span><strong x-text="err.name"></strong> — <span x-text="err.error"></span></span>
              </div>
            </template>
          </div>
        </div>

        <!-- USTAWIENIA + CTA -->
        <div class="card card-hover animate-popin rounded-3xl p-5" x-show="docs.length" x-cloak>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label class="block">
              <span class="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-slate-500" x-text="t('settings.lang')"></span>
              <select x-model="lang" :disabled="busy"
                      class="w-full rounded-xl border border-white/10 bg-slate-900/80 px-3 py-2.5 text-sm text-white outline-none transition focus:border-fuchsia-400/60 disabled:opacity-50">
                <option value="pl">Polski</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="block">
              <span class="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-slate-500" x-text="t('settings.length')"></span>
              <select x-model="length" :disabled="busy"
                      class="w-full rounded-xl border border-white/10 bg-slate-900/80 px-3 py-2.5 text-sm text-white outline-none transition focus:border-fuchsia-400/60 disabled:opacity-50">
                <option value="short" x-text="t('length.short')"></option>
                <option value="standard" x-text="t('length.standard')"></option>
                <option value="long" x-text="t('length.long')"></option>
                <option value="xl" x-text="t('length.xl')"></option>
              </select>
            </label>
          </div>

          <div class="mt-4 flex items-center justify-between text-[11px] text-slate-500">
            <span>
              <strong class="text-slate-300" x-text="t('stats.files', {n: docs.length})"></strong> ·
              <strong class="text-slate-300" x-text="fmtNum(totalChars, lang) + ' ' + t('stats.chars')"></strong> ·
              <strong class="text-indigo-300" x-text="totalChunks + ' ' + partsWord(totalChunks, lang)"></strong>
            </span>
            <span class="hidden items-center gap-1.5 sm:flex">
              <span class="kbd">Ctrl</span><span class="text-slate-600">+</span><span class="kbd">Enter</span>
            </span>
          </div>

          <button type="button" @click="generate()" :disabled="busy || !docs.length"
                  class="grad-btn mt-3 flex w-full items-center justify-center gap-2 rounded-2xl px-6 py-3.5 text-sm font-bold text-white shadow-lg shadow-fuchsia-600/20 transition">
            <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x-show="!busy"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/></svg>
            <svg class="h-[18px] w-[18px] animate-spin-slow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" x-show="busy" x-cloak><path d="M21 12a9 9 0 1 1-6.2-8.56" stroke-linecap="round"/></svg>
            <span x-text="busy ? t('cta.generating') : 'Summary'"></span>
          </button>
        </div>

        <!-- HISTORIA -->
        <div x-show="history.length" x-cloak class="card animate-popin rounded-3xl p-5">
          <div class="mb-3 flex items-center justify-between px-1">
            <span class="text-[11px] font-bold uppercase tracking-widest text-slate-500" x-text="t('history.title')"></span>
            <button @click="clearHistory()" class="text-[11px] font-semibold text-slate-500 transition hover:text-red-300" x-text="t('history.clear')"></button>
          </div>
          <div class="space-y-2">
            <template x-for="h in history" :key="h.id">
              <button @click="loadHistory(h)"
                      class="flex w-full items-start gap-3 rounded-xl border border-white/8 bg-slate-900/40 px-3 py-2.5 text-left transition hover:border-cyan-400/40 hover:bg-slate-900/70">
                <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-md bg-cyan-400/10 text-cyan-300">
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg>
                </span>
                <span class="min-w-0 flex-1">
                  <span class="block truncate text-xs font-semibold text-slate-200" x-text="firstLine(h.summary, lang)"></span>
                  <span class="block text-[10px] text-slate-500" x-text="t('history.meta', {date: h.date, n: h.files.length, model: h.stats.model})"></span>
                </span>
              </button>
            </template>
          </div>
        </div>
      </section>

      <!-- ================= PRAWA KOLUMNA ================= -->
      <aside class="lg:col-span-7 lg:sticky lg:top-[76px] self-start">

        <!-- --- STAN: START --- -->
        <div x-show="!busy && !summary" x-cloak class="card animate-popin rounded-3xl p-7 sm:p-9">
          <div class="mx-auto max-w-md text-center">
            <div class="relative mx-auto h-28 w-28">
              <div class="absolute inset-0 rounded-[2rem] bg-gradient-to-br from-indigo-500/25 via-fuchsia-500/20 to-cyan-500/25 rotate-6"></div>
              <div class="absolute inset-0 rounded-[2rem] bg-gradient-to-br from-indigo-500/30 to-fuchsia-500/30 -rotate-3 backdrop-blur">
                <div class="grid h-full w-full place-items-center">
                  <svg class="h-11 w-11 text-white/90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h3"/>
                  </svg>
                </div>
              </div>
            </div>

            <h2 class="mt-6 text-xl font-extrabold text-white" x-text="t('start.title')"></h2>
            <p class="mt-2 text-sm leading-relaxed text-slate-400" x-text="docs.length ? t('start.readyDocs') : t('start.uploadDocs')"></p>

            <div class="mt-7 space-y-3 text-left">
              <template x-for="step in howSteps" :key="step.n">
                <div class="flex items-start gap-3 rounded-xl border border-white/8 bg-white/[.03] px-3.5 py-3">
                  <span class="grid h-6 w-6 shrink-0 place-items-center rounded-lg grad-btn text-[11px] font-black text-white" x-text="step.n"></span>
                  <span>
                    <span class="block text-[13px] font-bold text-white" x-text="step.t"></span>
                    <span class="block text-xs text-slate-500" x-text="step.d"></span>
                  </span>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- --- STAN: THINKING --- -->
        <div x-show="busy" x-cloak id="thinking-panel"
             class="card animate-popin overflow-hidden rounded-3xl">
          <div class="relative px-7 py-9 text-center">
            <div class="absolute inset-x-0 top-0 h-40 bg-gradient-to-b from-fuchsia-500/10 to-transparent"></div>

            <div class="relative mx-auto h-24 w-24">
              <span class="pulse-ring"></span><span class="pulse-ring r2"></span>
              <span class="orb-ring"></span>
              <span class="absolute inset-[3px] grid place-items-center rounded-full bg-gradient-to-br from-indigo-500 to-fuchsia-600 shadow-[0_10px_40px_-8px_rgba(217,70,239,.7)]">
                <svg class="h-9 w-9 text-white animate-floaty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 4.5 17.5v-11A2.5 2.5 0 0 1 7 4a2.5 2.5 0 0 1 2.5-2z"/>
                  <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 19.5 17.5v-11A2.5 2.5 0 0 0 17 4a2.5 2.5 0 0 0-2.5-2z"/>
                </svg>
              </span>
            </div>

            <div class="relative mt-6 text-lg font-extrabold text-white">Thinking<span class="grad-text" x-text="dots"></span></div>
            <p class="relative mt-1 text-sm text-slate-400" x-text="stage || t('thinking.preparing')"></p>

            <div class="relative mx-auto mt-6 max-w-sm">
              <div class="h-1.5 w-full overflow-hidden rounded-full bg-white/10">
                <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 via-fuchsia-500 to-cyan-400 transition-all duration-500"
                     :class="progress === null ? 'w-1/3 animate-shimmer' : ''"
                     :style="progress !== null ? `width: ${progress}%` : 'background-size:200% 100%'"></div>
              </div>
              <div class="mt-1.5 flex justify-between text-[10.5px] font-medium text-slate-500">
                <span x-text="providerLabel"></span>
                <span x-text="progress !== null ? progress + '%' : t('thinking.inProgress')"></span>
              </div>
            </div>
          </div>

          <!-- oś kroków -->
          <div class="border-t border-white/8 bg-black/25 px-7 py-5">
            <ul class="space-y-3">
              <template x-for="s in steps" :key="s.key">
                <li class="flex items-center gap-3 text-[13px]">
                  <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full"
                        :class="s.state === 'done' ? 'bg-emerald-400/15 text-emerald-300' : 'bg-fuchsia-500/15 text-fuchsia-300'">
                    <svg x-show="s.state === 'done'" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                    <svg x-show="s.state !== 'done'" x-cloak class="h-3 w-3 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M21 12a9 9 0 1 1-6.2-8.56" stroke-linecap="round"/></svg>
                  </span>
                  <span :class="s.state === 'done' ? 'text-slate-400' : 'font-semibold text-white'" x-text="s.text"></span>
                </li>
              </template>
            </ul>
          </div>
        </div>

        <!-- --- STAN: WYNIK --- -->
        <div x-show="summary && !busy" x-cloak id="result-panel"
             class="card animate-popin overflow-hidden rounded-3xl">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/8 bg-gradient-to-r from-emerald-400/8 via-transparent to-transparent px-6 py-4">
            <div class="flex items-center gap-3">
              <span class="grid h-9 w-9 place-items-center rounded-xl bg-emerald-400/15 text-emerald-300 ring-1 ring-emerald-400/30">
                <svg class="h-4.5 w-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              <div>
                <div class="text-sm font-extrabold text-white" x-text="t('result.title')"></div>
                <div class="text-[11px] text-slate-500" x-text="statsLabel"></div>
              </div>
            </div>
            <div class="flex flex-wrap gap-1.5">
              <button @click="copySummary()" class="inline-flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-2.5 py-1.5 text-[11px] font-bold text-slate-200 transition hover:bg-white/10">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span x-text="copied ? t('result.copied') : t('result.copy')"></span>
              </button>
              <button @click="downloadSummary()" class="inline-flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-2.5 py-1.5 text-[11px] font-bold text-slate-200 transition hover:bg-white/10">
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                .md
              </button>
              <button @click="reset()" class="inline-flex items-center gap-1.5 rounded-lg grad-btn px-2.5 py-1.5 text-[11px] font-bold text-white transition" x-text="t('result.new')">
              </button>
            </div>
          </div>

          <div class="px-6 py-5">
            <article class="prose-summary max-h-[62vh] overflow-y-auto scroll-slim pr-2" x-html="renderedSummary"></article>
          </div>

          <div x-show="statsFiles.length" class="border-t border-white/8 px-6 py-3.5">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500" x-text="t('result.source')"></span>
              <template x-for="f in statsFiles" :key="f">
                <span class="max-w-[180px] truncate rounded-md bg-white/5 px-2 py-1 text-[11px] font-medium text-slate-300" x-text="f" :title="f"></span>
              </template>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- ==== TOAST ==== -->
  <div x-show="toast" x-cloak
       x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-3"
       x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200"
       x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="fixed bottom-5 right-5 z-50 max-w-sm rounded-2xl border border-red-500/30 bg-red-950/95 px-4 py-3 text-sm text-red-200 shadow-2xl backdrop-blur">
    <div class="flex items-start gap-2.5">
      <svg class="mt-0.5 h-4 w-4 shrink-0 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
      <span x-text="toast"></span>
      <button @click="toast = ''" class="ml-2 text-red-400 hover:text-red-200">&times;</button>
    </div>
  </div>

  <footer class="border-t border-white/5 py-6 text-center text-[11px] text-slate-600" x-html="t('footer')">
  </footer>

  <!-- moduł PRZED Alpine: x-data="summaryApp()" wymaga globala ustawionego przed startem Alpine -->
  <script type="module" src="/static/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</body>
</html>
